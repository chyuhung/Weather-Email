name: 天气邮件推送（早晚双时段）

on:
  schedule:
    # 晚间推送：UTC 14:00 = 北京时间 22:00
    - cron: "0 14 * * *"
    # 早间推送：UTC 23:00 = 北京时间 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: '推送模式: morning 或 evening'
        required: false
        default: 'morning'

jobs:
  send-weather-evening:
    # 仅在晚间 cron（北京时间 22:00）触发，不响应手动调度
    if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run evening weather script
        env:
          GAODE_KEY: ${{ secrets.GAODE_KEY }}
          CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -B main.py --mode evening

  send-weather-morning:
    # 在早间 cron（北京时间 07:00）或手动调度时触发
    if: github.event.inputs.mode == 'morning' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run morning weather script
        env:
          GAODE_KEY: ${{ secrets.GAODE_KEY }}
          CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -B main.py --mode morning
