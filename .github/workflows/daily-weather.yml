name: 天气邮件推送（早晚双时段）

on:
  # schedule:
    # 晚间推送：UTC 14:00 = 北京时间 22:00（推送明日天气）
    # - cron: "0 14 * * *"
    # 早间推送：UTC 23:00 = 北京时间 07:00（推送今日天气）
    # - cron: "0 23 * * *"
  workflow_dispatch:
    # 手动触发时自动根据北京时间判断模式

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Determine mode and run
        env:
          GAODE_KEY:       ${{ secrets.GAODE_KEY }}
          CAIYUN_TOKEN:    ${{ secrets.CAIYUN_TOKEN }}
          EMAIL_SENDER:    ${{ secrets.EMAIL_SENDER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_RECEIVER:  ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          LOCATION:        ${{ secrets.LOCATION }}
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "Current Beijing hour: $BEIJING_HOUR"

          if [ "$BEIJING_HOUR" -ge 6 ] && [ "$BEIJING_HOUR" -lt 14 ]; then
            MODE="morning"
          else
            MODE="evening"
          fi
          echo "Auto-selected mode: $MODE"

          python -B main.py --mode $MODE
